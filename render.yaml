services:
  - type: web
    name: trandeflow-api
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && DATABASE_URL=$NEON_DATABASE_URL pnpm --filter @workspace/db run push --accept-data-loss && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        sync: false
      - key: MEXC_API_KEY
        sync: false
      - key: MEXC_API_SECRET
        sync: false
      - key: NEON_DATABASE_URL
        sync: false

  - type: web
    name: tradeflow-frontend
    env: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/tradeflow run build
    staticPublishPath: artifacts/tradeflow/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://trandeflow-api.onrender.com
