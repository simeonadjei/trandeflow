services:
  - type: web
    name: tradeflow-frontend
    env: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/tradeflow run build
    staticPublishPath: artifacts/tradeflow/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://trandeflow-api.onrender.com
