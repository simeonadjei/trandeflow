kind = "web"
previewPath = "/"
title = "TradeFlow"
version = "1.0.0"
id = "artifacts/tradeflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20986

[services.development]
run = "pnpm --filter @workspace/tradeflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tradeflow", "run", "build" ]
publicDir = "artifacts/tradeflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20986"
BASE_PATH = "/"
